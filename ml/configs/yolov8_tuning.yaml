    model: yolov8n.pt
    imgsz: 320
    batch: 16

  - name: nano_416_resolution
    model: yolov8n.pt
    imgsz: 416
    batch: 8

  - name: small_320_capacity
    model: yolov8s.pt
    imgsz: 320
    batch: 8